# Traduções adicionais em https://github.com/heartcombo/devise/wiki/I18n

pt-BR:
  devise:
    confirmations:
      confirmed: "Seu endereço de e-mail foi confirmado com sucesso."
      send_instructions: "Você receberá um e-mail com instruções para confirmar seu endereço de e-mail em alguns minutos."
      send_paranoid_instructions: "Se o seu endereço de e-mail existir em nosso banco de dados, você receberá um e-mail com instruções para confirmá-lo em alguns minutos."

    failure:
      already_authenticated: "Você já está autenticado."
      inactive: "Sua conta ainda não foi ativada."
      invalid: "%{authentication_keys} ou senha inválidos."
      locked: "Sua conta está bloqueada."
      last_attempt: "Você tem mais uma tentativa antes que sua conta seja bloqueada."
      not_found_in_database: "%{authentication_keys} ou senha inválidos."
      timeout: "Sua sessão expirou. Entre novamente para continuar."
      unauthenticated: "Você precisa entrar ou se cadastrar antes de continuar."
      unconfirmed: "Você precisa confirmar seu endereço de e-mail antes de continuar."

    mailer:
      confirmation_instructions:
        subject: "Instruções para confirmação"

      reset_password_instructions:
        subject: "Instruções para redefinição de senha"

      unlock_instructions:
        subject: "Instruções para desbloqueio"

      email_changed:
        subject: "E-mail alterado"

      password_change:
        subject: "Senha alterada"

    omniauth_callbacks:
      failure: "Não foi possível autenticar você através de %{kind} porque \"%{reason}\"."
      success: "Autenticado com sucesso através da conta %{kind}."

    passwords:
      no_token: "Você não pode acessar esta página sem ter vindo de um e-mail de redefinição de senha. Se você veio de um e-mail de redefinição de senha, verifique se utilizou a URL completa fornecida."
      send_instructions: "Você receberá um e-mail com instruções para redefinir sua senha em alguns minutos."
      send_paranoid_instructions: "Se o seu endereço de e-mail existir em nosso banco de dados, você receberá um link para recuperação de senha em alguns minutos."
      updated: "Sua senha foi alterada com sucesso. Você agora está autenticado."
      updated_not_active: "Sua senha foi alterada com sucesso."

    registrations:
      destroyed: "Até logo! Sua conta foi cancelada com sucesso. Esperamos ver você novamente em breve."
      signed_up: "Bem-vindo! Seu cadastro foi realizado com sucesso."
      signed_up_but_inactive: "Seu cadastro foi realizado com sucesso. No entanto, não foi possível autenticá-lo porque sua conta ainda não foi ativada."
      signed_up_but_locked: "Seu cadastro foi realizado com sucesso. No entanto, não foi possível autenticá-lo porque sua conta está bloqueada."
      signed_up_but_unconfirmed: "Uma mensagem com um link de confirmação foi enviada para o seu endereço de e-mail. Acesse o link para ativar sua conta."
      update_needs_confirmation: "Sua conta foi atualizada com sucesso, mas precisamos verificar seu novo endereço de e-mail. Verifique seu e-mail e acesse o link de confirmação para confirmar o novo endereço."
      updated: "Sua conta foi atualizada com sucesso."
      updated_but_not_signed_in: "Sua conta foi atualizada com sucesso, mas como sua senha foi alterada, você precisa entrar novamente."

    sessions:
      signed_in: "Login realizado com sucesso."
      signed_out: "Logout realizado com sucesso."
      already_signed_out: "Logout realizado com sucesso."

    unlocks:
      send_instructions: "Você receberá um e-mail com instruções para desbloquear sua conta em alguns minutos."
      send_paranoid_instructions: "Se sua conta existir, você receberá um e-mail com instruções para desbloqueá-la em alguns minutos."
      unlocked: "Sua conta foi desbloqueada com sucesso. Entre para continuar."

  errors:
    messages:
      already_confirmed: "já foi confirmado, tente entrar novamente"
      confirmation_period_expired: "precisa ser confirmado dentro de %{period}; solicite uma nova confirmação"
      expired: "expirou; solicite um novo"
      not_found: "não encontrado"
      not_locked: "não estava bloqueado"
      not_saved:
        one: "1 erro impediu que %{resource} fosse salvo:"
        other: "%{count} erros impediram que %{resource} fosse salvo:"
